name: Sync Facebook news
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'styles.css'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/facebook-news.yml'
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: facebook-news
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch published Page posts
        id: facebook
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v23.0' }}
        run: node scripts/sync-facebook.mjs
      - name: Report Facebook sync issue
        if: steps.facebook.outcome == 'failure'
        run: echo '::warning::Facebook sync failed. Publishing the site with the last saved news feed. Check the Page token in Actions Secrets.'
      - name: Save refreshed news
        if: steps.facebook.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/facebook-posts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh published Facebook news'
            git push origin HEAD:main
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp *.html styles.css _site/
          cp -r assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed news
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
