<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="5th Dawn band archive.">
  <title>5th Dawn — Archive</title>
  <link rel="stylesheet" href="styles.css?v=20261024-logo-fit">
</head>
<body>
  <main>
    <p class="eyebrow">Band archive</p>
    <h1><img class="band-logo" src="assets/5th-dawn-logo.png?v=complete" alt="5th Dawn" width="1200" height="424"></h1>
    <div class="divider" aria-hidden="true"></div>
    <p>An archive of 5th Dawn.</p>

    <section class="releases" aria-labelledby="releases-heading">
      <h2 id="releases-heading">Releases</h2>
      <figure class="release">
        <img src="assets/evolving-toward-oblivion.jpg" alt="Evolving Toward Oblivion album cover by 5th Dawn" width="1500" height="1500" loading="lazy">
        <figcaption>
          <h3>Evolving Toward Oblivion (2009)</h3>
          <p>
            James McD - Vox<br>
            Juan Sanchez - Guitars<br>
            Derek Ahrens - Guitars, Vox<br>
            Sean Deppe - Bass<br>
            Chris Kostielney - Drums
          </p>
          <p>
            Mixed and mastered by Dustin Miller<br>
            at Audio Aggregate Studios
          </p>
        </figcaption>
      </figure>
      <figure class="release">
        <img src="assets/atrocity-domine.jpg" alt="Atrocity Domine album cover by 5th Dawn" width="1425" height="1425" loading="lazy">
        <figcaption>
          <h3>Atrocity Domine (2019)</h3>
          <p>
            James McD - Vocals<br>
            Juan Sanchez - Guitars, Bass<br>
            Hal 9000B - Drums
          </p>
          <p>
            Mixed and mastered by Adrian Burroughs<br>
            Logo by Gage Genthner<br>
            Artwork courtesy of Bruce Pennington
          </p>
        </figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
